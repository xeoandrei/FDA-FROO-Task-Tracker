services:
  mysql:
    image: mysql:8.0
    container_name: froo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-froo_root_password}
      MYSQL_DATABASE: ${DB_NAME:-froo_db}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - froo_mysql_data:/var/lib/mysql
      - ./froo_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

volumes:
  froo_mysql_data:
